<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skeeper</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        .card {
            margin-top: 20px;
        }
        .form-section {
            margin-bottom: 15px;
        }
        .table th, .table td {
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="app" class="container mt-5">
        <!-- Activity Selection -->
        <div class="card">
            <div class="card-body">
                <h4 class="card-title">Track Activity</h4>
                <div class="mb-3">
                    <label for="activitySelect" class="form-label">Select Activity</label>
                    <select v-model="selectedActivity" class="form-select" id="activitySelect">
                        <option disabled value="">Please select an activity</option>
                        <option value="masturbation">Self Stimulate</option>
                        <option value="sex">Shower</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- Self Stimulate Form -->
        <div v-if="selectedActivity === 'masturbation'" class="card form-section">
            <div class="card-body">
                <h5>Self Stimulate</h5>
                <form @submit.prevent="addEntry">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="duration" class="form-label">Duration (minutes)</label>
                            <input v-model="form.duration" type="number" class="form-control" id="duration" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input v-model="form.date" type="date" class="form-control" id="date" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="time" class="form-label">Time</label>
                            <input v-model="form.time" type="time" class="form-control" id="time" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="comment" class="form-label">Comment</label>
                        <textarea v-model="form.comment" class="form-control" id="comment" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>

        <!-- Shower Form -->
        <div v-if="selectedActivity === 'sex'" class="card form-section">
            <div class="card-body">
                <h5>Shower</h5>
                <form @submit.prevent="addEntry">
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="position" class="form-label">Position</label>
                            <select v-model="form.position" class="form-select" id="position" required>
                                <option value="missionary">Deep Impact</option>
                                <option value="doggy">Doggy</option>
                                <option value="cowgirl">Cowgirl</option>
                                <option value="other">Other</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="duration" class="form-label">Duration (minutes)</label>
                            <input v-model="form.duration" type="number" class="form-control" id="duration" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="date" class="form-label">Date</label>
                            <input v-model="form.date" type="date" class="form-control" id="date" required>
                        </div>
                    </div>
                    <div class="mb-3">
                        <label for="time" class="form-label">Time</label>
                        <input v-model="form.time" type="time" class="form-control" id="time" required>
                    </div>
                    <div class="mb-3">
                        <label for="comment" class="form-label">Comment</label>
                        <textarea v-model="form.comment" class="form-control" id="comment" rows="2"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">Submit</button>
                </form>
            </div>
        </div>

        <!-- Logged Activities Table -->
        <div class="card form-section">
            <div class="card-body">
                <h4 class="card-title">Logged Activities</h4>
                <table class="table table-bordered table-striped">
                    <thead class="table-light">
                        <tr>
                            <th>Activity</th>
                            <th>Duration</th>
                            <th>Date</th>
                            <th>Time</th>
                            <th>Comment</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr v-for="(entry, index) in activities" :key="index">
                            <td>{{ entry.activity }}</td>
                            <td>{{ entry.duration }} mins</td>
                            <td>{{ entry.date }}</td>
                            <td>{{ entry.time }}</td>
                            <td>{{ entry.comment }}</td>
                            <td><button class="btn btn-danger btn-sm" @click="deleteEntry(index)">Delete</button></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Activity Chart -->
        <div class="card form-section">
            <div class="card-body">
                <h4 class="card-title">Activity Summary</h4>
                <canvas id="activityChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        new Vue({
            el: '#app',
            data: {
                selectedActivity: '',
                form: {
                    activity: '',
                    duration: '',
                    date: '',
                    time: '',
                    comment: '',
                    position: ''
                },
                activities: [],
                existingData: {} // Holds other data like 'test': 'test'
            },
            methods: {
                async addEntry() {
                    const newEntry = {
                        activity: this.selectedActivity === 'masturbation' ? 'Self Stimulate' : 'Shower',
                        duration: this.form.duration,
                        date: this.form.date,
                        time: this.form.time,
                        comment: this.form.comment,
                        position: this.selectedActivity === 'sex' ? this.form.position : null
                    };

                    // Push the new entry locally
                    this.activities.push(newEntry);

                    // Reset form fields
                    this.resetForm();

                    // Save to JSONBin
                    await this.saveToJSONBin();

                    // Update the chart
                    this.updateChart();
                },
                resetForm() {
                    this.form.duration = '';
                    this.form.date = '';
                    this.form.time = '';
                    this.form.comment = '';
                    this.form.position = '';
                },
                async loadActivitiesFromJSONBin() {
                    try {
                        const response = await fetch('https://api.jsonbin.io/v3/b/670f3d34ad19ca34f8b94d5b', {
                            headers: {
                                'X-Master-Key': '$2a$10$Y5suue9biRzxk9IWEPT0NOl5A2p1/mqUPENgvdkmZ9YOSPi1TDLs.'
                            }
                        });
                        if (response.ok) {
                            const data = await response.json();
                            // Check if "activities" exist, otherwise initialize it
                            this.activities = data.record.activities || [];
                            this.existingData = data.record; // Store other unrelated data
                        }
                    } catch (error) {
                        console.error('Error loading data:', error);
                    }

                    // Update the chart after data is loaded
                    this.updateChart();
                },
                async saveToJSONBin() {
                    try {
                        // Merge new activities with any existing data (e.g., { test: 'test' })
                        const updatedData = {
                            ...this.existingData,
                            activities: this.activities
                        };

                        const response = await fetch('https://api.jsonbin.io/v3/b/670f3d34ad19ca34f8b94d5b', {
                            method: 'PUT',
                            headers: {
                                'Content-Type': 'application/json',
                                'X-Master-Key': '$2a$10$Y5suue9biRzxk9IWEPT0NOl5A2p1/mqUPENgvdkmZ9YOSPi1TDLs.'
                            },
                            body: JSON.stringify(updatedData)
                        });
                        if (!response.ok) {
                            console.error('Error saving data:', response.status);
                        }
                    } catch (error) {
                        console.error('Error saving data:', error);
                    }
                },
                deleteEntry(index) {
                    this.activities.splice(index, 1);
                    this.saveToJSONBin(); // Update the data on JSONBin
                    this.updateChart(); // Update chart after deletion
                },
                updateChart() {
                    const selfStimulateCount = this.activities.filter(a => a.activity === 'Self Stimulate').length;
                    const showerCount = this.activities.filter(a => a.activity === 'Shower').length;

                    const ctx = document.getElementById('activityChart').getContext('2d');
                    if (this.chart) {
                        this.chart.destroy(); // Destroy previous chart if it exists
                    }
                    this.chart = new Chart(ctx, {
                        type: 'bar',
                        data: {
                            labels: ['Self Stimulate', 'Shower'],
                            datasets: [{
                                label: 'Activity Count',
                                data: [selfStimulateCount, showerCount],
                                backgroundColor: ['#3498db', '#e74c3c'],
                                borderColor: ['#2980b9', '#c0392b'],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                }
            },
            mounted() {
                this.loadActivitiesFromJSONBin();
            }
        });
    </script>
</body>
</html>
